syntax = "proto3";

package gophkeeper.sync;

option go_package = "github.com/eugegm01-dev/gophkeepston/api/proto/sync;syncpb";

service Sync {
  rpc Push(PushRequest) returns (PushResponse);
  rpc Pull(PullRequest) returns (PullResponse);
}

message Entry {
  string id = 1;
  string type = 2;
  bytes encrypted_data = 3;
  bytes encrypted_meta = 4;
  int64 version = 5;
  int64 updated_at = 6;
}

message PushRequest {
  repeated Entry entries = 1;
}

message PushResponse {}

message PullRequest {
  int64 since_version = 1;
}

message PullResponse {
  repeated Entry entries = 1;
}